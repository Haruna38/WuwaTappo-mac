[package]
name = "wuwatappo"
version = "1.0.4"
description = "Wuwa Tappo (native macOS port)"
edition = "2021"

[lib]
name = "wuwatappo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.10", features = ["tray-icon", "image-png", "macos-private-api", "devtools"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-autostart = "2"
tauri-plugin-log = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
time = { version = "0.3", features = ["formatting"] }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSWindow", "NSScreen", "NSApplication", "NSRunningApplication", "NSWorkspace", "NSCursor", "NSView", "NSEvent", "NSResponder", "NSGraphics", "NSPanel"] }
objc2-foundation = { version = "0.3", features = ["NSGeometry", "NSString", "NSArray", "NSDictionary", "NSValue", "NSUserDefaults", "NSProcessInfo", "NSObject", "NSEnumerator"] }
core-graphics = "0.24"
core-foundation = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
semver = "1"
tiny_http = "0.12"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
